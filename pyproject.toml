[project]
name = "datacamp-ml-track"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ömer Yaslıtaş", email = "omer.yaslitas@metu.edu.tr" }
]
requires-python = ">=3.12"
dependencies = [
    "gensim>=4.4.0",
    "hyperopt>=0.3.0",
    "jupyter>=1.1.1",
    "kagglehub>=1.0.2",
    "librosa>=1.0.0",
    "matplotlib>=3.11.2",
    "mlxtend>=0.25.0",
    "nbstripout>=0.9.1",
    "nltk>=3.10.3",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "readability>=0.3.2",
    "readability-lxml>=0.9",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "sentencepiece>=0.2.2",
    "setuptools<81",
    "spacy>=3.8.16",
    "torch>=2.14.1",
    "torchmetrics>=1.9.0",
    "torchvision>=0.29.1",
    "tpot>=1.1.0",
    "transformers<5.0",
]

[project.scripts]
datacamp-ml-track = "datacamp_ml_track:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
